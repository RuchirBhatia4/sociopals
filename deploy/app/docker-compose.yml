# Everything Sociopals needs on one server: the app, Postgres, and Caddy for HTTPS.
# Settings live in deploy/app/.env (copy env.example).
# Run from the repo root:  docker compose -f deploy/app/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sociopals:${POSTGRES_PASSWORD}@db:5432/sociopals
    depends_on:
      db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sociopals
      POSTGRES_USER: sociopals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociopals -d sociopals"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
